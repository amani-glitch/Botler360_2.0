steps:
  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/botler360:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/botler360:latest'
      - '.'

  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', 'gcr.io/$PROJECT_ID/botler360']

  # Deploy to Cloud Run with secrets from Secret Manager
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'botler360'
      - '--image=gcr.io/$PROJECT_ID/botler360:$SHORT_SHA'
      - '--region=europe-west1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=3'
      - '--set-env-vars=NODE_ENV=production'
      - '--set-secrets=GEMINI_API_KEY=gemini-api-key:latest,CRM_WEBHOOK_URL=crm-webhook-url:latest,CRM_API_KEY=crm-api-key:latest,CONTACT_WEBHOOK_URL=contact-webhook-url:latest'

images:
  - 'gcr.io/$PROJECT_ID/botler360:latest'
  - 'gcr.io/$PROJECT_ID/botler360:$SHORT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
