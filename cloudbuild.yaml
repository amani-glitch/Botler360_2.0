steps:
  # Build Docker image (with client-side Gemini key as build arg)
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker build \
          --build-arg VITE_GEMINI_API_KEY=$$GEMINI_CLIENT_KEY \
          -t gcr.io/$PROJECT_ID/botler360:$SHORT_SHA \
          -t gcr.io/$PROJECT_ID/botler360:latest \
          .
    secretEnv: ['GEMINI_CLIENT_KEY']

  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', 'gcr.io/$PROJECT_ID/botler360']

  # Deploy to Cloud Run with secrets from Secret Manager
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'botler360'
      - '--image=gcr.io/$PROJECT_ID/botler360:$SHORT_SHA'
      - '--region=europe-west1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=3'
      - '--set-env-vars=NODE_ENV=production,CLOUD_RUN_URL=https://botler360-u5azdc2cvq-ew.a.run.app'
      - '--set-secrets=GEMINI_API_KEY=gemini-api-key:latest,GEMINI_LIVE_API_KEY=gemini-client-api-key:latest,CRM_WEBHOOK_URL=crm-webhook-url:latest,CRM_API_KEY=crm-api-key:latest,CONTACT_WEBHOOK_URL=contact-webhook-url:latest'

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/gemini-client-api-key/versions/latest
      env: 'GEMINI_CLIENT_KEY'

images:
  - 'gcr.io/$PROJECT_ID/botler360:latest'
  - 'gcr.io/$PROJECT_ID/botler360:$SHORT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
