<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Botler Chat · Template de référence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="botler-chat.css">
</head>
<body>

<!-- ======================================================
     Option 1 — Auto-init via data-attributes (recommandé)
     ====================================================== -->
<div id="botler-chat"
     data-theme="tourisme"
     data-avatar="/mascots/tourisme.png"
     data-teaser="Parlons de votre projet de voyage ✈️"
     data-greeting-title="Bonjour 👋"
     data-greeting-body="Quelle destination vous fait rêver ?"
     data-quick-replies="✈️ Séjour sur-mesure|🏨 Réserver un hôtel|🗺️ Activités locales|🌍 Multilingue"
     data-mode="floating"></div>

<script src="botler-chat.js" defer></script>

</body>
</html>
