<!doctype html>
<html lang="fr">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Botler 360 — Chatbots IA & Solutions Digitales pour Entreprises</title>
    <meta name="description" content="Botler 360 : plateforme SaaS d'IA conversationnelle. Chatbots intelligents, sites web et applications mobiles pour automatiser votre relation client." />
    <meta name="theme-color" content="#f59e0b" />
    <meta name="robots" content="index, follow" />
    <link rel="icon" type="image/x-icon" href="/images/botler-logo-full.png" />
    <link rel="canonical" href="https://botler360.com/" />

    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="Botler 360" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:type" content="website" />

    <!-- Schema.org JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://botler360.com/#organization",
          "name": "Botler 360",
          "legalName": "Best of Tours Ltd",
          "url": "https://botler360.com",
          "logo": {
            "@type": "ImageObject",
            "url": "https://botler360.com/images/botler-logo-full.png"
          },
          "description": "Plateforme SaaS d'IA conversationnelle pour les entreprises francophones. Chatbots intelligents, sites web et applications mobiles.",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "44 chemin de Provence",
            "addressLocality": "Entraigues-sur-la-Sorgue",
            "addressCountry": "FR"
          },
          "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "sales",
            "email": "contact@botler360.com",
            "availableLanguage": ["French", "English"]
          },
          "founder": {
            "@type": "Person",
            "name": "Yacine Bakouche"
          },
          "makesOffer": [
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "SoftwareApplication",
                "name": "Botler 360",
                "applicationCategory": "BusinessApplication",
                "applicationSubCategory": "Chatbot IA",
                "operatingSystem": "Web",
                "offers": {
                  "@type": "AggregateOffer",
                  "priceCurrency": "EUR",
                  "lowPrice": "0",
                  "offerCount": "4"
                }
              }
            }
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://botler360.com/#website",
          "name": "Botler 360",
          "url": "https://botler360.com",
          "publisher": { "@id": "https://botler360.com/#organization" },
          "inLanguage": "fr-FR",
          "description": "Chatbots IA, sites web et applications mobiles pour automatiser la relation client des entreprises."
        }
      ]
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
